# Local Postgres for development: `npm run db:up`. Data persists in the named volume.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: safepaws
      POSTGRES_PASSWORD: safepaws
      POSTGRES_DB: safepaws
    ports:
      - "5432:5432"
    volumes:
      - safepaws-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safepaws"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  safepaws-db:
